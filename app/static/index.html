<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Assistant</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --text: #1a1a1a; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --user-bg: #2563eb; --user-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --panel: #1f2025; --text: #e8e8ea; --muted: #9ca3af;
      --border: #2e3038; --accent: #60a5fa; --user-bg: #2563eb; --user-text: #fff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  main { width: 100%; max-width: 760px; padding: 24px 16px; display: flex; flex-direction: column; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, textarea {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; font: inherit;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  textarea { resize: vertical; min-height: 52px; margin-bottom: 0; }
  button {
    font: inherit; font-weight: 500; padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #chat { flex: 1; display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user-bg); color: var(--user-text); }
  .ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .sources { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .rewrite { font-size: 12px; color: var(--muted); font-style: italic; }
  .error { color: #dc2626; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row textarea { flex: 1; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .link { background: none; color: var(--accent); padding: 0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Policy Assistant</h1>
  <div class="sub">Ask about the leave policies. Answers come only from the uploaded documents.</div>

  <section id="login" class="card">
    <label for="username">Username</label>
    <input id="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginError" class="error"></div>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <span id="who"></span>
      <button id="logoutBtn" class="link">Sign out</button>
    </div>
    <div id="chat"></div>
    <div class="card row">
      <textarea id="question" placeholder="How many days of parental leave do I get?" rows="2"></textarea>
      <button id="askBtn">Ask</button>
    </div>
    <div id="chatError" class="error"></div>
  </section>
</main>

<script>
let config = null, token = null, conversationId = null;

const $ = (id) => document.getElementById(id);

async function loadConfig() {
  config = await (await fetch("./ui/config")).json();
}

async function signIn(username, password) {
  // Cognito's API is callable from the browser; this app client is public (no secret).
  const res = await fetch(`https://cognito-idp.${config.region}.amazonaws.com/`, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-amz-json-1.1",
      "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
    },
    body: JSON.stringify({
      AuthFlow: "USER_PASSWORD_AUTH",
      ClientId: config.clientId,
      AuthParameters: { USERNAME: username, PASSWORD: password },
    }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || "Sign-in failed");
  if (!data.AuthenticationResult) throw new Error(`Challenge: ${data.ChallengeName}`);
  return data.AuthenticationResult.AccessToken;
}

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  $("chat").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function ask(question) {
  const res = await fetch("./chat", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify({ question, conversation_id: conversationId }),
  });
  if (res.status === 401) throw new Error("Session expired — sign in again.");
  if (!res.ok) throw new Error(`Request failed (${res.status})`);
  return res.json();
}

$("loginBtn").onclick = async () => {
  $("loginError").textContent = "";
  $("loginBtn").disabled = true;
  try {
    token = await signIn($("username").value.trim(), $("password").value);
    $("who").textContent = `Signed in as ${$("username").value.trim()}`;
    $("login").hidden = true;
    $("app").hidden = false;
    $("question").focus();
  } catch (e) {
    $("loginError").textContent = e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
};

$("logoutBtn").onclick = () => {
  token = null; conversationId = null;
  $("chat").innerHTML = ""; $("password").value = "";
  $("app").hidden = true; $("login").hidden = false;
};

$("askBtn").onclick = async () => {
  const question = $("question").value.trim();
  if (!question) return;
  $("chatError").textContent = "";
  $("question").value = "";
  addMessage(question, "user");
  const pending = addMessage("Thinking…", "ai");
  $("askBtn").disabled = true;
  try {
    const data = await ask(question);
    conversationId = data.conversation_id;
    pending.textContent = data.answer;
    if (data.standalone_question && data.standalone_question !== question) {
      const r = document.createElement("div");
      r.className = "rewrite";
      r.textContent = `searched for: ${data.standalone_question}`;
      pending.appendChild(r);
    }
    if (data.sources?.length) {
      const s = document.createElement("div");
      s.className = "sources";
      s.textContent = "Sources: " + data.sources.map((x) => `${x.source} p.${x.page}`).join(", ");
      pending.appendChild(s);
    }
  } catch (e) {
    pending.remove();
    $("chatError").textContent = e.message;
  } finally {
    $("askBtn").disabled = false;
    $("question").focus();
  }
};

$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("askBtn").click(); }
});

loadConfig();
</script>
</body>
</html>
