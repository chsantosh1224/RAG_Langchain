services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local dev only; AWS uses RDS IAM auth
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"       # reachable from this laptop only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      retries: 10

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    # Default batch (16k tokens) runs out of memory on CPU; our chunks are ~250 tokens.
    command: --model-id Qwen/Qwen3-Embedding-0.6B --max-batch-tokens 2048 --auto-truncate
    ports:
      - "127.0.0.1:8080:80"         # TEI listens on 80 inside the container
    volumes:
      - tei_models:/data            # downloaded model is cached here

volumes:
  pgdata:
  tei_models:
