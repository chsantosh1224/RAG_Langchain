server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Hashed asset filenames never change contents, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep an old app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: unknown paths return index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
